worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	sendfile on;
	keepalive_timeout 65;
	client_max_body_size 50m;
	large_client_header_buffers 8 32k;
	server_tokens off;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	upstream sveltekit {
		server app:3000;
	}

	upstream pocketbase {
		server pocketbase:8090;
	}

	# App: domain, www, and IP
	server {
		listen 80 default_server;
		server_name hoomban.ir www.hoomban.ir _;

		location /.well-known/acme-challenge/ {
			root /var/www/certbot;
		}

		location / {
			proxy_pass http://sveltekit;
			include /etc/nginx/proxy-params.conf;
		}
	}

	# PocketBase API + admin on subdomain (and still on :8090)
	server {
		listen 80;
		server_name pb.hoomban.ir;

		location /.well-known/acme-challenge/ {
			root /var/www/certbot;
		}

		location / {
			proxy_pass http://pocketbase;
			include /etc/nginx/proxy-params.conf;
		}
	}

	server {
		listen 8090;
		server_name _;

		location / {
			proxy_pass http://pocketbase;
			include /etc/nginx/proxy-params.conf;
		}
	}

	include /etc/nginx/ssl-enabled.conf;
}
