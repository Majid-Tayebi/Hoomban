name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
        env:
          POCKETBASE_URL: http://127.0.0.1:8090
          POCKETBASE_ADMIN_EMAIL: ci@hoomban.local
          POCKETBASE_ADMIN_PASSWORD: CiTestPassword123!

  acl:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download PocketBase
        run: |
          curl -fsSL https://github.com/pocketbase/pocketbase/releases/download/v0.27.1/pocketbase_0.27.1_linux_amd64.zip -o pb.zip
          unzip -q pb.zip -d pocketbase-bin
          chmod +x pocketbase-bin/pocketbase

      - name: Start PocketBase and verify ACL
        run: |
          ./pocketbase-bin/pocketbase superuser upsert ci@hoomban.local CiTestPassword123! --dir=./pocketbase/pb_data
          ./pocketbase-bin/pocketbase serve --dir=./pocketbase/pb_data --migrationsDir=./pocketbase/pb_migrations --http=127.0.0.1:8090 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8090/api/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8090/api/health
          npm run verify:acl
        env:
          POCKETBASE_ADMIN_EMAIL: ci@hoomban.local
          POCKETBASE_ADMIN_PASSWORD: CiTestPassword123!
